name: Update Misode integration

on:
  workflow_dispatch:
  schedule:
    # Daily at 11:23 Asia/Shanghai. GitHub may delay scheduled runs.
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: update-misode
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test update merge behavior
        run: node --test tests/misode-update.test.mjs tests/misode-theme.test.mjs tests/misode-i18n.test.mjs tests/misode-schema.test.mjs tests/misode-full.test.mjs
      - name: Check upstream revision
        id: check
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('./vendor/misode-upstream.json').revision")"
          latest="$(git ls-remote https://github.com/misode/misode.github.io.git refs/heads/master | cut -f1)"
          [[ "$latest" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$latest" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$latest" ]; then echo 'changed=true' >> "$GITHUB_OUTPUT"; fi

  update:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download exact upstream revision
        env:
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/misode/misode.github.io.git "$RUNNER_TEMP/misode-upstream"
          git -C "$RUNNER_TEMP/misode-upstream" checkout --detach "$UPSTREAM_SHA"
      - name: Merge upstream while preserving QUST MC changes
        run: node scripts/update-misode.mjs "$RUNNER_TEMP/misode-upstream"
      - name: Install build dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Type check Misode and build Wiki
        run: npm run build
      - name: Install browser for integration checks
        run: |
          npm install --prefix "$RUNNER_TEMP/misode-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/misode-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify navigation and generator in Chromium
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          export PLAYWRIGHT_MODULE="file://$RUNNER_TEMP/misode-browser/node_modules/playwright/index.mjs"
          node --test tests/misode-browser.test.mjs
      - name: Open or refresh update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/update-misode
          delete-branch: true
          add-paths: |
            vendor/misode/
            vendor/misode-upstream.json
          commit-message: 'chore: update vendored Misode'
          title: 'chore: update Misode to ${{ needs.check.outputs.sha }}'
          body: |
            Updates [misode/misode.github.io](https://github.com/misode/misode.github.io/commit/${{ needs.check.outputs.sha }}).

            Local changes were preserved with a three-way merge against the previously imported commit. Misode TypeScript checks, the full Wiki build, and the Chromium navigation/generator check passed before this PR was created.

            Review the upstream changes and deployment preview before merging. This workflow does not enable automatic merging.
